# -*- conf -*-

term=foot
login-shell=no

app-id=foot
title=foot
# locked-title=no

font=monospace:size=14
word-delimiters=,│`|:"'()[]{}<>
pad=10x10

[environment]
# name=value

[security]
osc52=enabled  # disabled|copy-enabled|paste-enabled|enabled

[bell]
